apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: observability
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_OTEL_IRSA_ROLE_ARN
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: coralogix-private-key
  namespace: observability
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "REPLACE_CORALOGIX_SECRET_ARN"
        objectType: "secretsmanager"
        jmesPath:
          - path: "private_key"
            objectAlias: "private_key"
  secretObjects:
    - secretName: otel-coralogix-credentials
      type: Opaque
      data:
        - objectName: private_key
          key: CORALOGIX_PRIVATE_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app: otel-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      volumes:
        - name: otel-config
          configMap:
            name: otel-collector-config
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: coralogix-private-key
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.104.0
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: self-metrics
              containerPort: 8888
            - name: health
              containerPort: 13133
          env:
            - name: CORALOGIX_OTLP_HOST
              value: REPLACE_CORALOGIX_OTLP_HOST
            - name: CORALOGIX_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: otel-coralogix-credentials
                  key: CORALOGIX_PRIVATE_KEY
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otelcol
              readOnly: true
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: self-metrics
      port: 8888
      targetPort: self-metrics
    - name: health
      port: 13133
      targetPort: health
