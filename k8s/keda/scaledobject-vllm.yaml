apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-openai-queue
  namespace: inferencia
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-openai
  minReplicaCount: 1
  maxReplicaCount: 32
  pollingInterval: 15
  cooldownPeriod: 120
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Pods
              value: 2
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 120
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        metricName: vllm_num_requests_waiting
        threshold: "4"
        query: sum(max_over_time(vllm_num_requests_waiting[1m]))
