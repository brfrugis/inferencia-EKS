apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-openai
  namespace: inferencia
  labels:
    app: vllm-openai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-openai
  template:
    metadata:
      labels:
        app: vllm-openai
    spec:
      serviceAccountName: vllm
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.8.2
          args:
            - --model
            - /models/REPLACE_MODEL_DIR
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --dtype
            - auto
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.92"
            - --enable-chunked-prefill
          env:
            - name: VLLM_USE_V1
              value: "1"
            - name: OTEL_SERVICE_NAME
              value: vllm-inferencia
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: "none"
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: 80Gi
              cpu: "16"
            requests:
              nvidia.com/gpu: 1
              memory: 48Gi
              cpu: "8"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models-s3
