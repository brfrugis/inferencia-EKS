name: Terraform apply

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: terraform

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Require TF_MODEL_BUCKET_NAME
        run: |
          if [ -z "${{ vars.TF_MODEL_BUCKET_NAME }}" ]; then
            echo "::error::Defina a variável de repositório TF_MODEL_BUCKET_NAME (nome globalmente único do bucket S3)."
            exit 1
          fi

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        env:
          TF_VAR_model_bucket_name: ${{ vars.TF_MODEL_BUCKET_NAME }}
          TF_VAR_coralogix_secret_arn: ${{ vars.TF_CORALOGIX_SECRET_ARN }}
        run: terraform apply -auto-approve -input=false
